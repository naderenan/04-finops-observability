apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    jsonData:
      authType: default   # EC2 instance role, no keys
      defaultRegion: us-east-1
